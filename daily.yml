name: Daily Tech Article Bot

on:
  schedule:
    # 平日（月〜金）の朝8:30 JST に実行 (UTC基準のため前日23:30)
    - cron: '30 23 * * 1-5'
  workflow_dispatch: # 手動実行ボタンを有効化

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: コードのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 必要なライブラリのインストール
        run: pip install requests feedparser

      - name: Botスクリプトの実行
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python main.py
